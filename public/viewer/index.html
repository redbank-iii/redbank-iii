
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset='utf-8'>
        <meta name='viewport' content='width=device-width, initial-scale=1.0, user-scalable=no'>
        <title>Redbank III — Interactive URDF Viewer</title>
        
        <link rel='modulepreload' href='./makepad_platform/web_gl.js'>

        <script>
            // The prebuilt wasm carries absolute paths from the machine it was compiled
            // on ("/Users/<someone>/home/makepad-dev-patched/..."). Those end up in every
            // visitor's console. We cannot rebuild the binary here, so strip the prefix
            // at the boundary — the message itself is kept, just not the build layout.
            (function () {
                var BUILD_PATH = /(?:\/Users\/[^\/\s]+|\/home\/[^\/\s]+)\/[^\s:]*?((?:platform|libs|widgets)\/src\/[^\s:]+)/g;
                ['log', 'info', 'warn', 'error', 'debug'].forEach(function (level) {
                    var original = console[level].bind(console);
                    console[level] = function () {
                        var args = Array.prototype.map.call(arguments, function (a) {
                            return typeof a === 'string' ? a.replace(BUILD_PATH, 'makepad:$1') : a;
                        });
                        original.apply(null, args);
                    };
                });
            })();
        </script>
        
        <script type='module'>
            const reportBrowserIssue = async (kind, data) => {
                try {
                    const payload = JSON.stringify({
                        kind,
                        href: location.href,
                        user_agent: navigator.userAgent,
                        data
                    });
                    const encoded = encodeURIComponent(payload.slice(0, 8192));
                    // `/$report_error` only exists under the makepad dev server. On the
                    // static site it 404s on every viewer load, so keep it local.
                    if (!/^https?:\/\/(localhost|127\.0\.0\.1)/.test(location.origin)) {
                        console.debug('[viewer]', kind, encoded.slice(0, 256));
                        return;
                    }
                    await fetch('/$report_error?data=' + encoded, {cache: 'no-store'});
                } catch (_error) {
                }
            };
            window.makepad_report_browser_issue = reportBrowserIssue;
            
            window.addEventListener('error', (event) => {
                let stack = '';
                if (event.error && event.error.stack) {
                    stack = '' + event.error.stack;
                }
                reportBrowserIssue('window.error', {
                    message: event.message || '',
                    filename: event.filename || '',
                    lineno: event.lineno || 0,
                    colno: event.colno || 0,
                    stack
                });
            });

            window.addEventListener('unhandledrejection', (event) => {
                let reason_message = '';
                let reason_stack = '';
                if (typeof event.reason === 'string') {
                    reason_message = event.reason;
                } else if (event.reason) {
                    reason_message = event.reason.message ? '' + event.reason.message : '' + event.reason;
                    reason_stack = event.reason.stack ? '' + event.reason.stack : '';
                }
                reportBrowserIssue('window.unhandledrejection', {
                    reason_message,
                    reason_stack
                });
            });

            try {
                
            window.makepad_small_font_aliases = true;
                
            const {WasmWebGL} = await import('./makepad_platform/web_gl.js');
            const wasm = await WasmWebGL.fetch_and_instantiate_wasm(
                './makepad-urdf-player.a82604ef91.wasm'
            );
            
                class MyWasmApp {
                    constructor(wasm) {
                        let canvas = document.getElementsByClassName('full_canvas')[0];
                        this.webgl = new WasmWebGL (wasm, this, canvas);
                    }
                }
                let app = new MyWasmApp(wasm);
            } catch (error) {
                reportBrowserIssue('startup.exception', {
                    message: error && error.message ? '' + error.message : '' + error,
                    stack: error && error.stack ? '' + error.stack : ''
                });
                throw error;
            }
        </script>
        
        <link rel='stylesheet' type='text/css' href='./makepad_platform/full_canvas.css'>
    </head> 
    <body>
        <canvas class='full_canvas'></canvas>
            <div class='canvas_loader' >
            <div style=''>
            Loading..
            </div>
        </div>
    </body>
    </html>
